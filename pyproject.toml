[project]
name = "sonolus.py"
version = "1.2.3"
description = "Sonolus engine development framework for Python"
readme = "README.md"
requires-python = ">=3.12.5"
dependencies = []

[project.scripts]
sonolus-py = "sonolus.build.cli:main"

[project.urls]
Documentation = "https://sonolus.py.qwewqa.xyz/"
Repository = "https://github.com/qwewqa/sonolus.py"
Issues = "https://github.com/qwewqa/sonolus.py/issues"
Changelog = "https://sonolus.py.qwewqa.xyz/changelog/"

[tool.uv]
default-groups = ["dev", "docs"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "sonolus/**/*.pyx" },
    { file = "sonolus/**/*.pxd" },
    { file = "sonolus/**/*.h" },
    { env = "SONOLUS_OPT_DEBUG_BUILD" },
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
exclude = ["docs/**/*.md"]

[tool.ruff.lint]
preview = true
select = ["F", "E", "W", "I", "N", "D", "UP", "YTT", "B", "A", "COM", "C4", "DTZ", "PIE", "PT", "Q", "SLOT", "SIM", "PTH", "PL", "PERF", "FURB", "LOG", "RUF"]
ignore = ["module-import-not-at-top-of-file", "D1", "missing-trailing-comma", "redefined-loop-name", "bad-dunder-method-name", "no-self-use", "import-outside-top-level", "import-private-name", "magic-value-comparison", "PLR09", "if-else-block-instead-of-if-exp", "incorrect-dict-iterator", "too-many-statements-in-try-clause", "repeated-append", "stdlib-module-shadowing", "class-as-data-structure", "reimplemented-operator", "line-too-long", "ambiguous-variable-name", "unnecessary-if", "property-without-return", "non-empty-init-module", "float-equality-comparison", "unnecessary-assign-before-yield", "unused-noqa", "noqa-comments"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = [
    "setuptools>=84.0.0",
    "Cython>=3.2.9; python_version < '3.15'",
    "Cython>=3.3.0; python_version >= '3.15'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sonolus*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyx", "*.c", "*.cpp"]

[dependency-groups]
dev = [
    "uv>=0.12.4",
    "hypothesis>=6.165.7",
    "pre-commit>=4.6.2",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "pytest-cov>=7.1.0",
    "tox>=4.60.0",
    "tox-uv>=1.36.0",
    "ty>=0.0.71",
    "numpy>=2.5.2",
    "pip>=26.2.1"
]
docs = [
    "zensical>=0.0.54",
    "mkdocstrings-python>=2.0.5",
]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-* cp315-*"
# Smoke-test
test-command = 'python -c "from sonolus.backend.optimize import run_passes, cfg_to_engine_node, optimize_and_finalize; from sonolus.backend._opt import ir, analysis, midend, lower, kernels, emit, driver; from sonolus.script.internal.context import ctx, set_ctx; marker = object(); previous = set_ctx(marker); assert previous is None and ctx() is marker; previous = set_ctx(None); assert previous is marker and ctx() is None"'

[tool.cibuildwheel.windows]
archs = ["auto64"]

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["py312", "py313", "py314", "py315"]

[tool.tox.env_run_base]
description = "Run tests"
passenv = ["CI"]
deps = [
    "hypothesis>=6.165.7",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "numpy>=2.5.2"
]
uv_python_preference = "managed"
package = "editable"
commands = [["pytest", "tests", "-n", "auto"]]

[tool.ty.environment]
root = ["./sonolus"]

[tool.ty.src]
include = ["sonolus/script"]
